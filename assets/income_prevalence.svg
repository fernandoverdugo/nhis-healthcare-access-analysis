<svg xmlns="http://www.w3.org/2000/svg" width="900" height="319" viewBox="0 0 900 319" role="img" aria-labelledby="title desc">
<title id="title">Delayed care by family poverty level</title>
<desc id="desc">Pooled across all 10 official income imputations</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17202a}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#5d6d7e}.lab{font-size:14px}.val{font-size:13px;font-weight:600}.bar{fill:#566573}.grid{stroke:#d5d8dc;stroke-width:1}</style>
<text x="30" y="38" class="title">Delayed care by family poverty level</text>
